<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="月球兔：坐在月牙上抱着小星星的白兔">
  <title>月球兔</title>
  <desc>月亮岛主形象。圆头、长耳、腮红、抱着发光小星星的白兔，坐在一弯月牙上。透明背景，可任意缩放。</desc>

  <defs>
    <radialGradient id="rabbitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7A5CB8" stop-opacity="0.40"/>
      <stop offset="52%" stop-color="#4A6FA5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B1026" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="crescentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A86E0"/>
      <stop offset="46%" stop-color="#EAEFF9"/>
      <stop offset="100%" stop-color="#F2C57C"/>
    </linearGradient>

    <linearGradient id="hoodGrad" x1="12%" y1="0%" x2="72%" y2="100%">
      <stop offset="0%" stop-color="#9B82E2"/>
      <stop offset="58%" stop-color="#7A5CB8"/>
      <stop offset="100%" stop-color="#4A3679"/>
    </linearGradient>

    <linearGradient id="furGrad" x1="18%" y1="0%" x2="68%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#F7F3FA"/>
      <stop offset="100%" stop-color="#E2D9F0"/>
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4DA"/>
      <stop offset="100%" stop-color="#F2C57C"/>
    </linearGradient>

    <filter id="softBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.6"/>
    </filter>
    <filter id="starBlur" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <g transform="translate(0,10)">

    <!-- 背后的柔光 -->
    <circle cx="120" cy="122" r="96" fill="url(#rabbitGlow)"/>

    <!-- 月牙 -->
    <path d="M56,140 Q120,200 184,140" fill="none" stroke="#F2C57C" stroke-width="13" stroke-linecap="round" opacity="0.32" filter="url(#softBlur)"/>
    <path d="M56,140 Q120,200 184,140" fill="none" stroke="url(#crescentGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- 小尾巴 -->
    <circle cx="92" cy="166" r="12" fill="url(#furGrad)"/>

    <!-- 兜帽 -->
    <path d="M120,52 C152,52 170,74 170,104 C170,124 157,137 143,141 L97,141 C83,137 70,124 70,104 C70,74 88,52 120,52 Z"
          fill="url(#hoodGrad)"/>

    <!-- 耳朵 -->
    <g>
      <ellipse cx="104" cy="46" rx="11" ry="27" fill="url(#furGrad)" transform="rotate(-13 104 46)"/>
      <ellipse cx="104" cy="48" rx="5.4" ry="18" fill="#E9B6C6" opacity="0.75" transform="rotate(-13 104 48)"/>
      <ellipse cx="136" cy="46" rx="11" ry="27" fill="url(#furGrad)" transform="rotate(13 136 46)"/>
      <ellipse cx="136" cy="48" rx="5.4" ry="18" fill="#E9B6C6" opacity="0.75" transform="rotate(13 136 48)"/>
    </g>

    <!-- 头 -->
    <circle cx="120" cy="100" r="32" fill="url(#furGrad)"/>

    <!-- 兜帽帽檐 -->
    <path d="M94.6,84 A30,30 0 0,1 145.4,84" fill="none" stroke="#B79EE8" stroke-width="7" stroke-linecap="round"/>

    <!-- 脸 -->
    <ellipse cx="102" cy="117" rx="7.5" ry="5.5" fill="#E896AF" opacity="0.3"/>
    <ellipse cx="138" cy="117" rx="7.5" ry="5.5" fill="#E896AF" opacity="0.3"/>
    <path d="M99,106 Q107,94 115,106" fill="none" stroke="#4A3D5E" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M125,106 Q133,94 141,106" fill="none" stroke="#4A3D5E" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M96.5,101.5 L91.5,97.5" fill="none" stroke="#4A3D5E" stroke-width="3" stroke-linecap="round"/>
    <path d="M143.5,101.5 L148.5,97.5" fill="none" stroke="#4A3D5E" stroke-width="3" stroke-linecap="round"/>
    <path d="M120,111 C121.6,113 123.4,114.2 125.2,115.2 C123.4,116.2 121.6,117.4 120,119.4 C118.4,117.4 116.6,116.2 114.8,115.2 C116.6,114.2 118.4,113 120,111 Z"
          fill="#E79BB2"/>
    <path d="M120,119.6 Q116.4,124 112.8,121" fill="none" stroke="#C08AA0" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M120,119.6 Q123.6,124 127.2,121" fill="none" stroke="#C08AA0" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 身体 -->
    <ellipse cx="120" cy="152" rx="26" ry="23" fill="url(#furGrad)"/>

    <!-- 前爪 -->
    <ellipse cx="96" cy="150" rx="9" ry="13" fill="url(#furGrad)" transform="rotate(-16 96 150)"/>
    <ellipse cx="144" cy="150" rx="9" ry="13" fill="url(#furGrad)" transform="rotate(16 144 150)"/>

    <!-- 脚 + 肉垫 -->
    <ellipse cx="105" cy="172" rx="10" ry="7" fill="#FCF9F4"/>
    <ellipse cx="135" cy="172" rx="10" ry="7" fill="#FCF9F4"/>
    <ellipse cx="105" cy="173.5" rx="4" ry="2.6" fill="#E896AF" opacity="0.32"/>
    <ellipse cx="135" cy="173.5" rx="4" ry="2.6" fill="#E896AF" opacity="0.32"/>

    <!-- 怀里的小星星 -->
    <path d="M120,133 C122.8,143 125.6,145.8 135.6,148.6 C125.6,151.4 122.8,154.2 120,164 C117.2,154.2 114.4,151.4 104.4,148.6 C114.4,145.8 117.2,143 120,133 Z"
          fill="#F2C57C" opacity="0.6" filter="url(#starBlur)"/>
    <path d="M120,133 C122.8,143 125.6,145.8 135.6,148.6 C125.6,151.4 122.8,154.2 120,164 C117.2,154.2 114.4,151.4 104.4,148.6 C114.4,145.8 117.2,143 120,133 Z"
          fill="url(#starGrad)"/>

    <!-- 氛围小亮点 -->
    <path d="M52,74 C53,79 54.6,80.6 59.6,81.6 C54.6,82.6 53,84.2 52,89.2 C51,84.2 49.4,82.6 44.4,81.6 C49.4,80.6 51,79 52,74 Z"
          fill="#F2C57C" opacity="0.8"/>
    <path d="M190,106 C190.8,109.8 192,111 195.8,111.8 C192,112.6 190.8,113.8 190,117.6 C189.2,113.8 188,112.6 184.2,111.8 C188,111 189.2,109.8 190,106 Z"
          fill="#EAEFF9" opacity="0.55"/>

  </g>
</svg>
