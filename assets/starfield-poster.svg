<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="月亮岛星空底图：深蓝夜空、星云与弯月">
  <title>月亮岛 · 星空底图</title>
  <desc>用于启动页、海报或大屏背景的静态星空。深蓝为主，低刺激、无高频闪烁，符合畏光用户的可接受亮度。</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#05081A"/>
      <stop offset="42%" stop-color="#0B1026"/>
      <stop offset="78%" stop-color="#131C3E"/>
      <stop offset="100%" stop-color="#1B2450"/>
    </linearGradient>
    <radialGradient id="nebulaViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7A5CB8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#7A5CB8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E8B8B" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#2E8B8B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C97A9B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C97A9B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFF6E2"/>
      <stop offset="100%" stop-color="#EBD9B4"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2C57C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F2C57C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meteorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9EEF7" stop-opacity="0"/>
      <stop offset="70%" stop-color="#E9EEF7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFF6E2" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="horizonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A6FA5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4A6FA5" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- 夜空 -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- 星云 -->
  <ellipse cx="300" cy="220" rx="440" ry="300" fill="url(#nebulaViolet)"/>
  <ellipse cx="1290" cy="640" rx="520" ry="330" fill="url(#nebulaTeal)"/>
  <ellipse cx="1010" cy="150" rx="360" ry="240" fill="url(#nebulaRose)"/>

  <!-- 星点：三档大小，高透明度差异制造纵深 -->
  <g fill="#E9EEF7">
    <circle cx="120" cy="88" r="1.6" opacity="0.85"/>
    <circle cx="212" cy="304" r="1.1" opacity="0.55"/>
    <circle cx="268" cy="140" r="2.2" opacity="0.9"/>
    <circle cx="354" cy="418" r="1.3" opacity="0.6"/>
    <circle cx="402" cy="96" r="1.0" opacity="0.45"/>
    <circle cx="468" cy="252" r="1.7" opacity="0.75"/>
    <circle cx="520" cy="512" r="1.2" opacity="0.5"/>
    <circle cx="586" cy="176" r="1.4" opacity="0.65"/>
    <circle cx="640" cy="392" r="0.9" opacity="0.4"/>
    <circle cx="704" cy="112" r="1.8" opacity="0.8"/>
    <circle cx="742" cy="604" r="1.1" opacity="0.45"/>
    <circle cx="806" cy="286" r="1.3" opacity="0.6"/>
    <circle cx="868" cy="470" r="1.0" opacity="0.42"/>
    <circle cx="922" cy="196" r="1.6" opacity="0.72"/>
    <circle cx="988" cy="368" r="1.2" opacity="0.5"/>
    <circle cx="1046" cy="104" r="1.4" opacity="0.66"/>
    <circle cx="1104" cy="540" r="0.9" opacity="0.38"/>
    <circle cx="1168" cy="248" r="1.7" opacity="0.76"/>
    <circle cx="1226" cy="420" r="1.1" opacity="0.48"/>
    <circle cx="1290" cy="132" r="1.3" opacity="0.6"/>
    <circle cx="1352" cy="352" r="1.5" opacity="0.7"/>
    <circle cx="1418" cy="500" r="1.0" opacity="0.44"/>
    <circle cx="1478" cy="208" r="1.9" opacity="0.82"/>
    <circle cx="1520" cy="612" r="1.2" opacity="0.5"/>
    <circle cx="86" cy="486" r="1.2" opacity="0.52"/>
    <circle cx="164" cy="676" r="1.4" opacity="0.6"/>
    <circle cx="248" cy="792" r="1.0" opacity="0.4"/>
    <circle cx="330" cy="608" r="1.3" opacity="0.56"/>
    <circle cx="442" cy="736" r="1.6" opacity="0.68"/>
    <circle cx="556" cy="828" r="1.1" opacity="0.46"/>
    <circle cx="668" cy="700" r="1.2" opacity="0.5"/>
    <circle cx="760" cy="806" r="1.5" opacity="0.64"/>
    <circle cx="884" cy="668" r="1.0" opacity="0.4"/>
    <circle cx="962" cy="762" r="1.3" opacity="0.55"/>
    <circle cx="1082" cy="844" r="1.1" opacity="0.44"/>
    <circle cx="1196" cy="716" r="1.4" opacity="0.58"/>
    <circle cx="1318" cy="798" r="1.2" opacity="0.5"/>
    <circle cx="1442" cy="700" r="1.5" opacity="0.62"/>
  </g>

  <!-- 少量偏亮的大星 -->
  <g fill="#FFF6E2">
    <circle cx="196" cy="196" r="2.6" opacity="0.9"/>
    <circle cx="912" cy="92" r="2.4" opacity="0.85"/>
    <circle cx="1108" cy="300" r="2.8" opacity="0.92"/>
    <circle cx="392" cy="672" r="2.5" opacity="0.86"/>
    <circle cx="1296" cy="820" r="2.2" opacity="0.8"/>
    <circle cx="716" cy="44" r="2.2" opacity="0.8"/>
  </g>

  <!-- 月亮 -->
  <circle cx="1240" cy="212" r="190" fill="url(#moonHalo)"/>
  <circle cx="1240" cy="212" r="78" fill="url(#moonBody)"/>
  <circle cx="1216" cy="188" r="14" fill="#E3D2AE" opacity="0.5"/>
  <circle cx="1262" cy="238" r="10" fill="#E3D2AE" opacity="0.42"/>
  <circle cx="1238" cy="256" r="7" fill="#E3D2AE" opacity="0.36"/>

  <!-- 流星（静态，仅用于海报；App 内为可关闭的动效） -->
  <line x1="1080" y1="60" x2="980" y2="160" stroke="url(#meteorGrad)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="420" y1="300" x2="356" y2="364" stroke="url(#meteorGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- 地平线雾气 -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#horizonGrad)"/>
</svg>
